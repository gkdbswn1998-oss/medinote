server:
  port: 8080
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 약사 면허증 이미지 업로드 허용 용량 (Nginx client_max_body_size와 동일하게 유지)
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

medication:
  service:
    base-url: ${MEDICATION_SERVICE_BASE_URL:http://localhost:8081}
